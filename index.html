<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English I Class</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        text-align: center;
        font-family: Arial, sans-serif;
    }

    /* ===== TV + SLIDESHOW CONTAINER ===== */
    .slideshow-container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        position: relative;
    }

    .mySlides {
        display: none;
        position: relative;
    }

    .mySlides img {
        width: 100%;
        height: auto;
        display: block;
        cursor: pointer;
    }

    /* ===== CIRCULAR TEACHER VIDEO ===== */
    .teacher-video {
        position: absolute;
        left: 5%;
        bottom: 7%;
        width: 16%;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #6f2dbd;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        z-index: 10;
    }

    /* Fade animation */
    .fade {
        animation: fade 1.5s;
    }

    @keyframes fade {
        from {
            opacity: .4;
        }

        to {
            opacity: 1;
        }
    }

    /* ===== THUMBNAILS ===== */
    .thumbnails {
        display: flex; 
    justify-content: center; 
    gap: 24px;
    align-items: center; 
    max-width: 900px; 
    margin: 6px auto 0; 
    }

    .thumbnails img {
        width: 78px;
        cursor: pointer;
        border: 2px solid transparent;
    }

    .thumbnails img:hover {
        border-color: #717171;
    }

    /* ===== PLAY / PAUSE (BOBCAT) ===== */
    .controls {
        margin-top: 4px;
    }

    .controls img {
        cursor: pointer;
    }
</style>
</head>

<body>

<!-- ===== SLIDESHOW / TV ===== -->
<div class="slideshow-container">

    <!-- ===== SLIDE 1: WELCOME ===== -->
    <div class="mySlides fade">

        <img src="./images/welcomeeng.gif" alt="Welcome">

        <!-- Circular teacher video -->
        <video
            id="teacherVideo"
            class="teacher-video"
            src="./videos/english.mp4"
            playsinline
            preload="metadata">
        </video>

    </div>

   <!-- ===== SLIDE 2: Vision/Mission ===== -->
    <div class="mySlides fade">
        <img src="./images/sit.gif" alt="Inclusion" id="videoSlide">
    </div>

   
   <!-- ===== SLIDE 3: Vision/Mission ===== -->
    <div class="mySlides fade">
        <img src="./images/announce.gif" alt="Announce" id="videoSlide">
    </div>

 <!-- ===== SLIDE 4: AGENDA ===== -->
    <div class="mySlides fade">
        <img src="./images/calendar.gif" alt="Official Announcements">
        </a>
    </div>


    <!-- ===== SLIDE 5: IXL ===== -->
    <div class="mySlides fade">
        <img src="./images/ixl.gif" alt="Announcements">
    </div>


    <!-- ===== SLIDE 6: CTE Courses ===== -->
    <div class="mySlides fade">
        <img src="./images/class.gif" alt="Daily">
    </div>



<!-- ===== THUMBNAILS (ALWAYS VISIBLE) ===== -->
<div class="thumbnails">

    <img src="./images/thumbnails/welcome-thumbnail.gif"
         onclick="currentSlide(1)">

    <img src="./images/thumbnails/sit-thumbnail.gif"
         onclick="currentSlide(2)">

    <img src="./images/thumbnails/announce-thumbnail.gif"
         onclick="currentSlide(3)">

    <img src="./images/thumbnails/calendar-thumbnail.gif"
         onclick="currentSlide(4)">

    <img src="./images/thumbnails/ixl-thumbnail.gif"
         onclick="currentSlide(5)">

    <img src="./images/thumbnails/class-thumbnail.gif"
         onclick="currentSlide(6)">
</div>


<!-- ===== BOBCAT CONTROL (BELOW THUMBNAILS) ===== -->
<div class="controls">

    <img id="playPlay"
         src="./images/pause-button.gif"
         onclick="toggleSlideshow()"
         title="Play / Pause">

</div>


<!-- ===== SCRIPT ===== -->
<script>

let slideIndex = 0;
let isPlaying = true;
let slideInterval;


/* ===== SHOW SLIDES ===== */

function showSlides() {

    let slides = document.getElementsByClassName("mySlides");

    for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }

    slideIndex++;

    if (slideIndex > slides.length) {
        slideIndex = 1;
    }

    slides[slideIndex - 1].style.display = "block";
}


/* ===== START SLIDESHOW ===== */

function startSlideshow() {

    showSlides();

    clearTimeout(slideInterval);

    slideInterval = setTimeout(function nextSlide() {

        showSlides();

        if (isPlaying) {
            slideInterval = setTimeout(nextSlide, slideIndex === 1 ? 10000 : 5000);
        }

    }, slideIndex === 1 ? 10000 : 5000);
}
function currentSlide(n) {

    slideIndex = n - 1;
    showSlides();

    if (isPlaying) {
        clearTimeout(slideInterval);

        slideInterval = setTimeout(function nextSlide() {

            showSlides();

            if (isPlaying) {
                slideInterval = setTimeout(nextSlide, slideIndex === 1 ? 10000 : 5000);
            }

        }, slideIndex === 1 ? 10000 : 5000);
    }
}

/* ===== PLAY / PAUSE ===== */

function toggleSlideshow() {

    if (isPlaying) {

        clearInterval(slideInterval);
        isPlaying = false;

    } else {

        startSlideshow();
        isPlaying = true;

    }
}


/* ===== THUMBNAIL NAVIGATION ===== */

function currentSlide(n) {

    slideIndex = n - 1;

    showSlides();

    if (isPlaying) {

        clearInterval(slideInterval);

        slideInterval = setInterval(showSlides, 5000);

    }
}


/* ===== TEACHER VIDEO ===== */

const teacherVideo = document.getElementById("teacherVideo");

teacherVideo.addEventListener("click", function() {

    if (teacherVideo.paused) {

        teacherVideo.play();

    } else {

        teacherVideo.pause();

    }

});


/* ===== EXISTING VIDEO SLIDE ===== */

const videoSlide = document.getElementById("videoSlide");

videoSlide.addEventListener("click", function() {

    window.open(
        './videos/english.mp4',
        'videoWindow',
        'width=640,height=360,resizable=yes'
    );

});


/* ===== START IMMEDIATELY ===== */

startSlideshow();

</script>

</body>
</html>
